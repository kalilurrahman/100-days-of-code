name: Deploy site to GitHub Pages

# Publishes the personal portal (portal/) as the site root, with the
# self-contained chess game served alongside it at /chess/.
#   https://<user>.github.io/<repo>/        → portal
#   https://<user>.github.io/<repo>/chess/  → chess game

on:
  push:
    branches: [master, main]
    paths:
      - "portal/**"
      - "chess/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically (source = GitHub Actions) so no manual
          # repo-settings toggle is required for the first deploy.
          enablement: true

      - name: Assemble site (portal at root, chess at /chess/)
        run: |
          mkdir -p _site/chess
          cp -r portal/. _site/
          cp -r chess/. _site/chess/

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

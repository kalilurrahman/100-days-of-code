name: Deploy site to GitHub Pages

# Publishes the GitHub Pages site:
#   /            -> the self-contained chess game (chess/)
#   /watracker/  -> the watracker browser playground
#                   (whatsapp-action-tracker/playground/)

on:
  push:
    branches:
      - master
      - main
      # Temporary: deploy from the PR branch so the watracker playground can
      # be tested before merge. Remove this line once PR #6 is merged.
      - claude/whatsapp-action-tracker-gsmsin
    paths:
      - "chess/**"
      - "whatsapp-action-tracker/playground/**"
      - ".github/workflows/deploy-chess-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically (source = GitHub Actions) so no manual
          # repo-settings toggle is required for the first deploy.
          enablement: true

      - name: Compose site (chess at root, watracker playground at /watracker/)
        run: |
          mkdir -p _site/watracker
          cp -r chess/* _site/
          cp -r whatsapp-action-tracker/playground/* _site/watracker/
          rm -f _site/watracker/build.sh

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
